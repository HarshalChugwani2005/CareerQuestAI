services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ravi
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      - kafka
      - db
      - redis
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"

  activity-consumer:
    build: .
    command: python -m app.workers.activity_consumer
    depends_on:
      - kafka
      - db
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi

  milestone-consumer:
    build: .
    command: python -m app.workers.milestone_consumer
    depends_on:
      - kafka
      - db
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi

  market-consumer:
    build: .
    command: python -m app.workers.market_consumer
    depends_on:
      - kafka
      - db
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi

  score-request-consumer:
    build: .
    command: python -m app.workers.score_request_consumer
    depends_on:
      - kafka
      - db
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi

  score-result-consumer:
    build: .
    command: python -m app.workers.score_result_consumer
    depends_on:
      - kafka
      - db
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ravi
