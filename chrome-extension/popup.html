<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: Arial; }
    .stat { display: flex; justify-content: space-between; margin: 10px 0; }
    .toggle { display: flex; align-items: center; gap: 10px; }
    input { flex: 1; padding: 5px; }
    button { padding: 5px 15px; cursor: pointer; }
    .streak { color: green; font-weight: bold; }
    .paused { opacity: 0.5; }
  </style>
</head>
<body>
  <h3>CareerQuestAI Tracker</h3>
  <div class="stat">
    <span>Today's Actions:</span>
    <span id="todayCount">0</span>
  </div>
  <div class="stat">
    <span>Streak:</span>
    <span id="streak" class="streak">0</span>
  </div>
  
  <div class="toggle">
    <label>Student ID:</label>
    <input id="studentId" placeholder="Enter ID">
    <button id="saveId">Save</button>
  </div>
  
  <div class="toggle">
    <label>Encryption Key:</label>
    <input id="encKey" type="password" placeholder="32-char key">
    <button id="saveKey">Save</button>
  </div>
  
  <div class="toggle">
    <input type="checkbox" id="pauseToggle">
    <label>Pause Tracking</label>
  </div>
  
  <div style="margin-top: 15px; font-size: 12px; color: gray;">
    <a href="#" id="privacy">Privacy Policy</a> | Batches every 5min
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
